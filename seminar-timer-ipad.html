<title>講演タイマー — iPad 単体</title>
<style>
  :root { --bg: #0a7d32; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    color: #fff; font-family: -apple-system, "Hiragino Sans", system-ui, sans-serif;
    overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
    display: flex; flex-direction: column; height: 100vh; height: 100dvh; background: #111;
  }
  /* 上：表示部（display.html 準拠の配色） */
  #display {
    flex: 1; min-height: 0; background: var(--bg); transition: background-color .4s ease;
    display: flex; flex-direction: column; align-items: stretch; justify-content: center;
    position: relative; padding: 1vh 2vw;
  }
  #display.warn { --bg: #c79100; }
  #display.over { --bg: #b3151f; }
  #display.over.blink { --bg: #6e0d14; }
  #segment { text-align: center; font-size: 4.5vh; font-weight: 800; letter-spacing: .04em; }
  #segment .badge { display: inline-block; padding: .15em .8em; border-radius: 999px; background: rgba(255,255,255,.18); }
  #clock {
    flex: 1; display: flex; align-items: center; justify-content: center; cursor: pointer;
    font-variant-numeric: tabular-nums; font-weight: 800; letter-spacing: -.02em;
    font-size: 30vh; line-height: 1; min-height: 0;
  }
  #clock .sign { font-size: 18vh; vertical-align: middle; margin-right: .05em; }
  #total { text-align: center; font-size: 4.4vh; font-weight: 700; opacity: .92; font-variant-numeric: tabular-nums; min-height: 5vh; }
  #status { text-align: center; font-size: 3.2vh; opacity: .85; min-height: 3.6vh; }
  #endtime { text-align: center; font-size: 2.8vh; opacity: .7; font-variant-numeric: tabular-nums; min-height: 3.2vh; }

  /* 下：操作部 */
  /* overscroll-behavior: contain＝パネル端まで来てもスクロールがページ/フルスクリーンに伝播しない
     （iOS でスクロールするとフルスクリーンが解除される問題の対策） */
  #panel { background: #1b1d21; color: #eee; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; max-height: 52vh; }
  .phead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
  .phead .row { display: flex; gap: 6px; }
  .toggle button { padding: 7px 12px; font-size: 13px; background: #2e3238; border-radius: 8px 0 0 8px; }
  .toggle button + button { border-radius: 0 8px 8px 0; }
  .toggle button.active { background: #2e7d32; }
  #btnSound { padding: 7px 12px; font-size: 13px; border-radius: 8px; background: #2e3238; flex: none; }
  #btnSound.on { background: #2e7d32; }
  #btnFs { padding: 7px 12px; font-size: 13px; border-radius: 8px; background: #2e3238; flex: none; }
  .bellbtn { flex: none; padding: 7px 11px; font-size: 13px; border-radius: 8px; background: #2e3238; }
  button { border: none; border-radius: 10px; background: #2e3238; color: #eee; cursor: pointer; font-family: inherit; }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button:disabled:active { transform: none; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .transport button { flex: 1; min-width: 64px; padding: 16px 10px; font-size: 17px; font-weight: 700; }
  .transport .primary { background: #2e7d32; }
  .transport .muted { background: #2e3238; }
  h2 { font-size: 13px; color: #9aa; margin: 14px 0 6px; font-weight: 600; }
  .setSummary { display: flex; gap: 8px; margin: 6px 0; }
  .setSummary > div { flex: 1; text-align: center; background: #23262b; border-radius: 8px; padding: 6px 3px; }
  .setSummary > div > span { display: block; font-size: 11px; color: #9aa; margin-bottom: 2px; }
  .setSummary .stepRow { display: flex; align-items: center; justify-content: center; gap: 3px; }
  .setSummary .stepRow b { font-size: 16px; font-variant-numeric: tabular-nums; min-width: 3.2em; }
  .setSummary .step { flex: none; width: 28px; min-width: 28px; padding: 6px 0; font-size: 15px; background: #3a3f47; border-radius: 6px; }
  .setSummary .tot { background: #2e7d32; }
  .setSummary .tot .step { background: #256528; }
  .preset { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 6px; }
  .preset button { background: #353a44; font-size: 14px; padding: 11px 6px; }
  .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .quick button { background: #353a44; font-size: 14px; padding: 11px 6px; }
  .adjust { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .adjust button { padding: 12px 4px; font-size: 14px; }
  .msgActive { text-align: center; font-size: 13px; min-height: 18px; margin-top: 8px; color: #e0b34a; }
  details { margin-top: 12px; border-top: 1px solid #2e3238; padding-top: 4px; }
  summary { cursor: pointer; color: #9aa; font-size: 14px; font-weight: 600; padding: 8px 0; }
  .field { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .field label { width: 9em; color: #9aa; font-size: 13px; }
  .field input[type=range] { flex: 1; }
  .field .val { width: 7em; font-size: 12px; color: #9aa; font-variant-numeric: tabular-nums; text-align: right; }
  #bellSounds button { flex: none; padding: 8px 18px; font-size: 13px; }
  #bellSounds button.active { background: #2e7d32; }
  .presetrow { display: flex; gap: 6px; margin-bottom: 6px; }
  .presetchip { flex: 1; font-size: 13px; padding: 9px 10px; text-align: left; background: #2e3238; }
  .presetdel { flex: none; padding: 9px 13px; font-size: 14px; background: #2e3238; }
  .hint { color: #6b7280; font-size: 11px; line-height: 1.6; }
  /* セッション中（走行・一時停止＝idle 以外）は時間設定 UI を隠す。idle（未開始・トーク間）だけ全展開。
     一時停止でもレイアウトが跳ねず、ステッパー誤タップによる set リセットも防ぐ。 */
  #panel:not(.idle) #editArea { display: none; }
  #panel.idle #adjustArea { display: none; }
  /* セッション中はパネルを上部（phead＝音/言語/全画面 の行＋開始/リセット/質疑へ の行）までに縮め、
     タイマーを最大化。時間調整(adjust)・メッセージ・詳細設定はその下に隠れ、パネル内スクロールで出す。 */
  #panel:not(.idle) { max-height: 135px; }

  #message {
    position: fixed; left: 0; right: 0; top: 0; background: #fff; color: #111;
    font-size: 7vh; font-weight: 800; text-align: center; padding: 3vh 4vw;
    box-shadow: 0 1vh 3vh rgba(0,0,0,.45); transform: translateY(-110%); transition: transform .3s ease; z-index: 9;
  }
  #message.show { transform: translateY(0); animation: msgflash .7s ease-in-out 3; }
  @keyframes msgflash { 0%, 100% { background: #fff; } 50% { background: #ffd21e; } }
  #overlay {
    position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 4vh; cursor: pointer; z-index: 10;
  }
  #overlay h1 { font-size: 7vh; } #overlay p { font-size: 3vh; opacity: .7; text-align: center; padding: 0 6vw; }
  #overlay.hidden { display: none; }
</style>

        <div class="tot"><span data-i18n="sumTotal"></span><div class="stepRow"><button class="step" data-dim="total" data-dir="-1">−</button><b id="valTotal">–</b><button class="step" data-dim="total" data-dir="1">＋</button></div></div>

      <div class="setSummary">

        <div><span data-i18n="sumTalkWarn2"></span><div class="stepRow"><button class="step" data-dim="talkWarn2" data-dir="-1">−</button><b id="valTalkWarn2">–</b><button class="step" data-dim="talkWarn2" data-dir="1">＋</button></div></div>

    <details>

  <div id="message"></div>

    <h1 id="ovTitle">タップして開始</h1>

<script>
/* ==== inlined: timer-core.js ==== */
// 研究会 講演タイマー — 共有コア（状態機械）。
// Node（server.js＝2台同期サーバ）とブラウザ（solo.html＝iPad 単体）の双方が同じ正本を使う。
// ここには I/O を持たない純粋ロジックだけを置く＝モード間でロジックがドリフトしないため。
//   - tick(state)          … running の時だけ1秒進め、跨いだしきい値に応じて鳴らすベル名を返す
//   - applyCommand(state,c)… コマンドを適用し {ok, bells, persist} を返す（ringBell の代わりに bells を返す）
// 鳴らす/配信/保存といった副作用は呼び出し側（server.js / solo.html）が担う。
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.TimerCore = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const MAX_SEC = 36000; // 持ち時間・予鈴の上限（10時間）＝暴走値の sanity cap
  const clampSec = (sec) => Math.max(0, Math.min(MAX_SEC, Math.round(sec)));

  // 既定状態（server.js / solo.html 共通の素の状態。bellEvent/lanIp/port 等の環境固有は呼び出し側が付ける）
  // 音色の許可リスト（bell.js の ORDER と同じ並び。server.js と solo.html の設定復元が参照する）
  const SOUNDS = ['deskbell', 'timer', 'alarm', 'school', 'doorbell', 'chime', 'bell', 'gong', 'marimba', 'beep', 'buzzer'];

  function defaultState() {
    return {
      phase: 'idle',        // idle | running | paused
      title: '',
      talkSec: 20 * 60,     // 講演の持ち時間
      qaSec: 10 * 60,       // 質疑応答の持ち時間（0 なら質疑なし）
      talkWarnSec: 5 * 60,  // 予鈴1（講演終了の何秒前・予鈴は講演のみ）
      talkWarn2Sec: 0,      // 予鈴2（既定オフ）
      segment: 'talk',      // 'talk' | 'qa'
      remainingSec: 20 * 60,// 現フェーズの残り。負で超過
      message: '',
      lang: 'ja',           // 'ja' | 'en'
      clockScope: 'phase',  // 'phase' | 'total'（全体=質疑込み）
      bellSound: 'deskbell', // SOUNDS のいずれか（bell.js の ORDER と一致）
      ipadBell: true,       // iPad でベルを鳴らすか
      volume: 0.9,          // 0–1
      pitch: 1.0,           // 周波数倍率
      bellGap: 1.0,         // 2鈴・3鈴の間隔の倍率（0.5–3）
      presets: [[10, 5, 3, 0], [15, 5, 3, 0], [25, 5, 5, 0], [30, 10, 5, 0], [45, 15, 5, 0]],
    };
  }

  // プリセット正規化（[講演,質疑,予鈴1,予鈴2]・型/範囲を矯正）
  function normalizePresets(arr) {
    if (!Array.isArray(arr)) return null;
    return arr
      .filter((p) => Array.isArray(p) && p.length >= 2)
      .map((p) => [
        Math.max(1, Math.min(600, Math.round(Number(p[0]) || 0))),
        Math.max(0, Math.min(600, Math.round(Number(p[1]) || 0))),
        Math.max(0, Math.min(600, Math.round(Number(p[2] != null ? p[2] : 5) || 0))),
        Math.max(0, Math.min(600, Math.round(Number(p[3] != null ? p[3] : 0) || 0))),
      ])
      .filter((p) => Number.isFinite(p[0]))
      .slice(0, 12);
  }

  // 毎秒の tick：running の時だけ減算し、跨いだしきい値に応じて鳴らすベル名（'warn'|'talkEnd'|'final'）を返す。
  function tick(state) {
    const bells = [];
    if (state.phase !== 'running') return bells;
    const before = state.remainingSec;
    state.remainingSec -= 1;
    const after = state.remainingSec;
    // 予鈴（講演フェーズのみ）：予鈴1・予鈴2 をそれぞれ上から跨いだ瞬間に1鈴。同値は二重鳴り防止で一意化。
    if (state.segment === 'talk') {
      for (const w of new Set([state.talkWarnSec, state.talkWarn2Sec])) {
        if (w > 0 && before > w && after <= w && after > 0) bells.push('warn');
      }
    }
    // フェーズ終了：0 を上から跨いだ瞬間
    if (before > 0 && after <= 0) {
      if (state.segment === 'talk' && state.qaSec > 0) {
        bells.push('talkEnd'); // 講演終了 → 質疑へ自動移行（2鈴）
        state.segment = 'qa';
        state.remainingSec = state.qaSec;
      } else {
        bells.push('final'); // 質疑終了（質疑なしなら講演終了）＝全体終了（3鈴）
      }
    }
    return bells;
  }

  // 設定永続化の対象キー（走行中の時計＝phase/segment/remainingSec/message は保存しない）
  const CONFIG_KEYS = ['talkSec', 'qaSec', 'talkWarnSec', 'talkWarn2Sec', 'bellSound', 'ipadBell', 'volume', 'pitch', 'bellGap', 'presets', 'lang', 'clockScope'];
  const CONFIG_ACTIONS = new Set(['set', 'setBellSound', 'setIpadBell', 'setVolume', 'setPitch', 'setBellGap', 'setPresets', 'setLang', 'setClockScope']);

  // コマンド適用。ringBell の代わりに鳴らすベルを bells に積み、{ok, bells, persist} を返す。
  function applyCommand(state, cmd) {
    const bells = [];
    let ok = true;
    switch (cmd.action) {
      case 'start':
        state.phase = 'running';
        break;
      case 'pause':
        if (state.phase === 'running') state.phase = 'paused';
        break;
      case 'reset':
        state.phase = 'idle';
        state.segment = 'talk';
        state.remainingSec = state.talkSec;
        break;
      case 'set': {
        const talkMin = Number(cmd.talkMin);
        const qaMin = Number(cmd.qaMin);
        const talkWarnMin = Number(cmd.talkWarnMin);
        const talkWarn2Min = Number(cmd.talkWarn2Min);
        if (Number.isFinite(talkMin) && talkMin > 0) state.talkSec = Math.max(1, clampSec(talkMin * 60));
        if (Number.isFinite(qaMin) && qaMin >= 0) state.qaSec = clampSec(qaMin * 60);
        if (Number.isFinite(talkWarnMin) && talkWarnMin >= 0) state.talkWarnSec = clampSec(talkWarnMin * 60);
        if (Number.isFinite(talkWarn2Min) && talkWarn2Min >= 0) state.talkWarn2Sec = clampSec(talkWarn2Min * 60);
        if (typeof cmd.title === 'string') state.title = cmd.title.slice(0, 120);
        state.segment = 'talk';
        state.remainingSec = state.talkSec;
        state.phase = 'idle';
        break;
      }
      case 'segment': {
        const to = cmd.to === 'qa' ? 'qa' : 'talk';
        state.segment = to;
        state.remainingSec = to === 'qa' ? state.qaSec : state.talkSec;
        if (to === 'qa') bells.push('talkEnd'); // 質疑へ進む＝2鈴
        break;
      }
      case 'adjust': {
        const d = Number(cmd.deltaSec);
        if (Number.isFinite(d)) state.remainingSec += Math.round(d);
        break;
      }
      case 'message':
        state.message = typeof cmd.text === 'string' ? cmd.text.slice(0, 200) : '';
        break;
      case 'clearMessage':
        state.message = '';
        break;
      case 'setLang':
        state.lang = cmd.lang === 'en' ? 'en' : 'ja';
        break;
      case 'setClockScope':
        state.clockScope = cmd.scope === 'total' ? 'total' : 'phase';
        break;
      case 'setBellSound':
        if (SOUNDS.includes(cmd.sound)) state.bellSound = cmd.sound;
        break;
      case 'setIpadBell':
        state.ipadBell = !!cmd.on;
        break;
      case 'setVolume': {
        const v = Number(cmd.value);
        if (Number.isFinite(v)) state.volume = Math.max(0, Math.min(1, v));
        break;
      }
      case 'setPitch': {
        const p = Number(cmd.value);
        if (Number.isFinite(p)) state.pitch = Math.max(0.25, Math.min(4, p));
        break;
      }
      case 'setBellGap': {
        const g = Number(cmd.value);
        if (Number.isFinite(g)) state.bellGap = Math.max(0.5, Math.min(3, g));
        break;
      }
      case 'setPresets': {
        const ps = normalizePresets(cmd.presets);
        if (ps) state.presets = ps;
        break;
      }
      case 'testBell':
        bells.push(['warn', 'talkEnd', 'final'].includes(cmd.type) ? cmd.type : 'warn');
        break;
      default:
        ok = false;
    }
    return { ok, bells, persist: ok && CONFIG_ACTIONS.has(cmd.action) };
  }

  return { MAX_SEC, clampSec, defaultState, normalizePresets, tick, applyCommand, CONFIG_KEYS, CONFIG_ACTIONS, SOUNDS };
});

</script>
<script>
/* ==== inlined: bell.js ==== */
// ベル音（WebAudio 合成・外部ファイル/依存なし）。iPad・操作画面で共有。
// AudioContext の生成/resume/再生をここに集約し、両ページは Bell.unlock()/ring()/running() を使う。
// soundName = 音色(voice)。bellType(warn/talkEnd/final) = 鳴らすメロディ（音数で 1鈴/2鈴/3鈴）。
// 音色の一覧（ORDER）が正本。許可リストは timer-core.js の SOUNDS と一致させる（build-solo と server が両方を読む）。
(function (root) {
  'use strict';

  // --- 音色（1音をどう鳴らすか） ---
  // 各音色は関数 voice(ctx, out, f, t)。省略可能な属性：
  //   voice.step = 音と音の間隔（秒。無ければ STEP）
  //   voice.seq  = { warn, talkEnd, final } 独自のメロディ（周波数の配列。0 は休符。無ければ SEQ）
  // 「f を無視して一定の高さ」で鳴る音色（タイマー・目覚まし・ゴング・ブザー）も pitch 倍率だけは反映する。

  // ピッ ピッ … の連打を 1 本のオシレータで作る共通部品（圧電ブザー系）。freqs は交互に使う周波数。
  function pulses(ctx, out, t, freqs, on, off, n, lvl, type) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    g.gain.setValueAtTime(0.0001, t);
    for (let i = 0; i < n; i++) {
      const s = t + i * (on + off);
      o.frequency.setValueAtTime(freqs[i % freqs.length], s);
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(lvl, s + 0.004);
      g.gain.setValueAtTime(lvl, s + on - 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, s + on);
    }
    o.connect(g).connect(out); o.start(t); o.stop(t + n * (on + off) + 0.05);
  }

  // 1 音を倍音の足し算で作る共通部品。parts = [[倍率, 相対音量, 減衰秒], ...]。attack は立ち上がり秒。
  function partials(ctx, out, f, t, parts, level, attack) {
    for (const [r, a, dec] of parts) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = f * r;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(level * a, t + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dec);
      o.connect(g).connect(out); o.start(t); o.stop(t + dec + 0.05);
    }
  }

  // 卓上ベル：研究会のタイムキーパーが鳴らす呼び鈴「チーン」。高い基音（約 2.8 kHz）に、わずかにずれた
  // 倍音と打撃の短い金属音を重ね、鋭く立ち上がって 1.5 秒ほどで消える。高さは一定（打つたび同じ音）。
  // 基音を 2 本わずかにずらして重ねると、本物のベルのうなり（シャラッとした揺れ）が出る。
  function voiceDeskBell(ctx, out, f, t) {
    const base = 2800 * pitch;
    partials(ctx, out, base, t, [[1, 1.0, 1.6], [1.004, 0.7, 1.4], [1.48, 0.35, 1.0], [2.09, 0.22, 0.6], [2.76, 0.14, 0.35]], 0.4, 0.002);
    partials(ctx, out, base, t, [[1.9, 0.5, 0.04], [3.3, 0.3, 0.03]], 0.5, 0.001); // 打撃音（ごく短い）
  }
  voiceDeskBell.step = 0.55;

  // タイマー：キッチンタイマーのアラーム「ピピピピ」（2.2 kHz 矩形波・4 連）。1鈴＝1 回、2鈴＝2 回、3鈴＝3 回。
  function voiceTimer(ctx, out, f, t) { pulses(ctx, out, t, [2200 * pitch], 0.06, 0.06, 4, 0.22, 'square'); }
  voiceTimer.step = 0.8;

  // 目覚まし：高さの違う 2 音を素早く交互に「ピロピロピロ」（8 連）。
  function voiceAlarm(ctx, out, f, t) { pulses(ctx, out, t, [2600 * pitch, 1950 * pitch], 0.045, 0.025, 8, 0.2, 'square'); }
  voiceAlarm.step = 0.9;

  // ビープ：丸い電子音 1 音（正弦波）。
  function voiceBeep(ctx, out, f, t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.4, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
    o.connect(g).connect(out); o.start(t); o.stop(t + 0.5);
  }

  // チャイム：グロッケン/鉄琴風の倍音加算（高次倍音ほど速く減衰＝自然な金属打）。sustain で余韻の長さを変える。
  const CHIME_PARTS = [[1, 1.0, 1.6], [2.01, 0.5, 0.8], [3.0, 0.3, 0.45], [4.2, 0.16, 0.25]];
  function voiceChime(ctx, out, f, t, sustain) {
    const k = sustain || 1;
    partials(ctx, out, f, t, CHIME_PARTS.map(([r, a, d]) => [r, a, d * k]), 0.42, 0.004);
  }

  // 学校チャイム：ウェストミンスターの鐘「キーンコーンカーンコーン」。1鈴＝1 節（4 音）、2鈴＝2 節、3鈴＝3 節。
  // 1 音はチャイムの余韻を長くしたもの。節の終わりに休符（0）を 1 つ置く。
  function voiceSchool(ctx, out, f, t) { voiceChime(ctx, out, f, t, 2.0); }
  voiceSchool.step = 0.62;

  // ピンポーン：玄関チャイム／正解音。ミ→ド の 2 音を伸ばす（基音＋オクターブ上を少し）。
  function voiceDoorbell(ctx, out, f, t) {
    const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain(), g2 = ctx.createGain();
    o.type = 'sine'; o.frequency.value = f;
    o2.type = 'sine'; o2.frequency.value = f * 2; g2.gain.value = 0.25;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.4, t + 0.015);
    g.gain.setValueAtTime(0.4, t + 0.25);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
    o.connect(g); o2.connect(g2).connect(g); g.connect(out);
    o.start(t); o.stop(t + 0.95); o2.start(t); o2.stop(t + 0.95);
  }
  voiceDoorbell.step = 0.42;

  // ベル：FM 合成の金属ベル（チューブラーベル風・長い減衰）
  function voiceBell(ctx, out, f, t) {
    const dur = 1.8, ratio = 1.41;
    const car = ctx.createOscillator(); car.type = 'sine'; car.frequency.value = f;
    const mod = ctx.createOscillator(); mod.type = 'sine'; mod.frequency.value = f * ratio;
    const mg = ctx.createGain();
    mg.gain.setValueAtTime(f * 2.2, t);
    mg.gain.exponentialRampToValueAtTime(f * 0.12, t + dur);
    mod.connect(mg); mg.connect(car.frequency);
    const amp = ctx.createGain();
    amp.gain.setValueAtTime(0.0001, t);
    amp.gain.exponentialRampToValueAtTime(0.34, t + 0.005);
    amp.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    car.connect(amp).connect(out);
    car.start(t); car.stop(t + dur); mod.start(t); mod.stop(t + dur);
  }

  // ゴング：低く長く響く銅鑼（非整数倍音・ゆっくり立ち上がる）。高さは一定（G3 基準）。
  function voiceGong(ctx, out, f, t) {
    partials(ctx, out, 196 * pitch, t, [[1, 1.0, 3.5], [1.5, 0.6, 2.8], [2.3, 0.45, 2.2], [3.1, 0.3, 1.6], [4.7, 0.18, 1.0]], 0.5, 0.03);
  }
  voiceGong.step = 1.3;

  // 木琴：乾いた短い木の音（基音＋4 倍音、速い減衰）。
  function voiceMarimba(ctx, out, f, t) {
    partials(ctx, out, f, t, [[1, 1.0, 0.5], [4, 0.35, 0.12], [9.2, 0.12, 0.06]], 0.5, 0.003);
  }
  voiceMarimba.step = 0.28;

  // ブザー：クイズの不正解音風「ブー」（低いのこぎり波）。1鈴＝ブー、2鈴＝ブーブー、3鈴＝ブーブーブー。
  function voiceBuzzer(ctx, out, f, t) {
    const dur = 0.45, lvl = 0.18;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sawtooth'; o.frequency.value = 160 * pitch;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(lvl, t + 0.01);
    g.gain.setValueAtTime(lvl, t + dur - 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(out); o.start(t); o.stop(t + dur + 0.05);
  }
  voiceBuzzer.step = 0.6;

  const VOICES = {
    deskbell: voiceDeskBell, timer: voiceTimer, alarm: voiceAlarm, school: voiceSchool, doorbell: voiceDoorbell, chime: voiceChime,
    bell: voiceBell, gong: voiceGong, marimba: voiceMarimba, beep: voiceBeep, buzzer: voiceBuzzer,
  };
  const ORDER = ['deskbell', 'timer', 'alarm', 'school', 'doorbell', 'chime', 'bell', 'gong', 'marimba', 'beep', 'buzzer'];
  const LABELS = {
    deskbell: { ja: '卓上ベル', en: 'Desk bell' },
    timer:    { ja: 'タイマー', en: 'Timer' },
    alarm:    { ja: '目覚まし', en: 'Alarm' },
    school:   { ja: '学校チャイム', en: 'School bell' },
    doorbell: { ja: 'ピンポーン', en: 'Doorbell' },
    chime:    { ja: 'チャイム', en: 'Chime' },
    bell:     { ja: 'ベル', en: 'Bell' },
    gong:     { ja: 'ゴング', en: 'Gong' },
    marimba:  { ja: '木琴', en: 'Xylophone' },
    beep:     { ja: 'ビープ', en: 'Beep' },
    buzzer:   { ja: 'ブザー', en: 'Buzzer' },
  };
  const DEFAULT = 'deskbell'; // 研究会で最も標準的な合図（呼び鈴）

  const N = { G4: 392.0, C5: 523.25, D5: 587.33, E5: 659.25, G5: 783.99, A5: 880.0 };
  const SEQ = {
    warn:    [N.A5],                 // 1鈴：高めに1音
    talkEnd: [N.G5, N.E5],           // 2鈴：下降2音（ピンポン）
    final:   [N.G5, N.E5, N.C5],     // 3鈴：下降3音（G-E-C＝終止感）
  };
  // ウェストミンスター（ハ長調に移調）：第 1〜3 節。各節の末尾に休符。
  const W1 = [N.E5, N.C5, N.D5, N.G4, 0], W2 = [N.C5, N.D5, N.E5, N.C5, 0], W3 = [N.E5, N.D5, N.C5, N.G4, 0];
  voiceSchool.seq = { warn: W1, talkEnd: [...W1, ...W2], final: [...W1, ...W2, ...W3] };
  // ピンポーン：ミ→ド。2鈴・3鈴は休符を挟んで繰り返す。
  const DB = [N.E5, N.C5];
  voiceDoorbell.seq = { warn: DB, talkEnd: [...DB, 0, ...DB], final: [...DB, 0, ...DB, 0, ...DB] };
  const STEP = 0.34;

  // --- AudioContext 管理（集約） ---
  let ctx = null;
  let volume = 0.9; // 0–1（master gain）
  function setVolume(v) {
    const n = Number(v);
    if (Number.isFinite(n)) volume = Math.max(0, Math.min(1, n));
  }
  let pitch = 1.0; // 全音の周波数倍率（音の高さ）
  function setPitch(p) {
    const n = Number(p);
    if (Number.isFinite(n)) pitch = Math.max(0.25, Math.min(4, n));
  }
  let gap = 1.0; // 2鈴・3鈴の打つ間隔の倍率（音色ごとの基準間隔 × gap）
  function setGap(g) {
    const n = Number(g);
    if (Number.isFinite(n)) gap = Math.max(0.5, Math.min(3, n));
  }
  // 音色 soundName の、いまの設定での打つ間隔（秒）。UI の表示用。
  function interval(soundName) {
    const voice = VOICES[soundName] || VOICES[DEFAULT];
    return (voice.step || STEP) * gap;
  }

  function getCtx() {
    try {
      if (!ctx || ctx.state === 'closed') {           // closed なら作り直す
        const AC = (typeof window !== 'undefined') && (window.AudioContext || window.webkitAudioContext);
        if (!AC) return null;
        ctx = new AC();
      }
    } catch (_) { return null; }
    return ctx;
  }

  // ユーザー操作のタイミングで呼ぶ：生成＋resume（解錠）
  function unlock() {
    const c = getCtx();
    if (c && c.state !== 'running') { try { c.resume(); } catch (_) {} }
    return c;
  }

  function running() { return !!ctx && ctx.state === 'running'; }

  function playInto(c, bellType, soundName) {
    const voice = VOICES[soundName] || VOICES[DEFAULT];
    const seq = (voice.seq && voice.seq[bellType]) || SEQ[bellType]; // 音色独自のメロディがあればそれを使う
    if (!seq) return;
    const master = c.createGain();
    master.gain.value = volume;
    master.connect(c.destination);
    const step = (voice.step || STEP) * gap; // 音色ごとの基準間隔 × 利用者の倍率
    let t = c.currentTime + 0.02;
    for (const f of seq) { if (f) voice(c, master, f * pitch, t); t += step; } // 0 は休符。ピッチ倍率を適用
    // 後始末（master ノードのリーク防止）
    const ms = (seq.length * step + 2.5) * 1000;
    try { setTimeout(() => { try { master.disconnect(); } catch (_) {} }, ms); } catch (_) {}
  }

  // ベルを鳴らす。suspended なら resume の完了を待ってから鳴らす（iOS 対策の肝）。
  function ring(bellType, soundName) {
    const c = getCtx();
    if (!c) return;
    const go = () => { try { playInto(c, bellType, soundName); } catch (_) {} };
    if (c.state === 'running') { go(); return; }
    try {
      const p = c.resume();
      if (p && p.then) p.then(go).catch(() => {}); else go();
    } catch (_) { go(); }
  }

  const api = { VOICES, ORDER, LABELS, SEQ, DEFAULT, unlock, ring, running, setVolume, setPitch, setGap, interval };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  if (root) root.Bell = api;
})(typeof window !== 'undefined' ? window : null);

<script>
const I18N = {
  ja: {
    start: '開始 / 再開', pause: '一時停止', reset: 'リセット', toQa: '質疑応答へ',
    adjustH: '時間調整', m1: '−1分', s10m: '−10秒', s10p: '+10秒', p1: '+1分',
    msgH: 'メッセージを表示', clear: 'メッセージを消す',
    moreH: '詳細設定（ベル音・プリセット編集・キーボード）',
    presetH: 'プリセット（講演＋質疑）',
    presetEditH: 'プリセット編集（✕で削除）', savePreset: '＋ 今の設定で新規追加',
    bellSoundH: 'ベル音（選ぶと試聴）', volLabel: '音量', pitchLabel: '高さ（ピッチ）', semi: '半音', gapLabel: '2鈴・3鈴の間隔', secU: '秒',
    keyH: 'キーボード操作', keyHint: 'スペース＝開始/一時停止　R＝リセット　Q＝質疑へ　T＝講演に戻す　←/→＝±10秒　↑/↓＝±1分',
    sumTalk: '講演', sumQa: '質疑', sumTotal: '全体', minU: '分', sumTalkWarn: '予鈴1', sumTalkWarn2: '予鈴2', warnShort: '予鈴',
    running: '進行中', paused: '一時停止中', standby: '待機中', talk: '講演', qa: '質疑応答', over: '超過',
    soundOn: '🔔 音 オン', soundOff: '🔕 音 オフ',
    ovTitle: 'タップして開始', ovHint: '音を鳴らすために最初に一度タップしてください',
    quick: ['あと5分です', 'あと1分です', 'そろそろまとめてください', '時間です'],
  },
  en: {
    start: 'Start / Resume', pause: 'Pause', reset: 'Reset', toQa: 'Go to Q&A',
    adjustH: 'Adjust time', m1: '−1 min', s10m: '−10 s', s10p: '+10 s', p1: '+1 min',
    msgH: 'Show a message', clear: 'Clear message',
    moreH: 'More (bell sound, edit presets, keyboard)',
    presetH: 'Presets (talk + Q&A)',
    presetEditH: 'Edit presets (✕ to delete)', savePreset: '＋ Add current as new',
    bellSoundH: 'Bell sound (tap to preview)', volLabel: 'Volume', pitchLabel: 'Pitch', semi: 'semitones', gapLabel: 'Gap between strikes', secU: 's',
    keyH: 'Keyboard', keyHint: 'Space = start/pause   R = reset   Q = to Q&A   T = back to talk   ←/→ = ±10 s   ↑/↓ = ±1 min',
    sumTalk: 'Talk', sumQa: 'Q&A', sumTotal: 'Total', minU: ' min', sumTalkWarn: 'Warn 1', sumTalkWarn2: 'Warn 2', warnShort: 'warn',
    running: 'Running', paused: 'Paused', standby: 'Standby', talk: 'Talk', qa: 'Q&A', over: 'OVERTIME',
    soundOn: '🔔 Sound ON', soundOff: '🔕 Sound OFF',
    ovTitle: 'Tap to start', ovHint: 'Tap once to enable the bell sound',
    quick: ['5 minutes left', '1 minute left', 'Please wrap up', 'Time is up'],
  },
};

const LS_KEY = 'seminar-timer-solo';
let state = TimerCore.defaultState();
let soundOn = true;
let lang = 'ja';
let blinkOn = false;
let lastPresetsSig = null;
const $ = (id) => document.getElementById(id);
function t() { return I18N[lang]; }

// ---- 永続化（localStorage）。走行中の時計は保存しない＝CONFIG_KEYS のみ＋soundOn ----
function load() {
  let raw = {};
  try { raw = JSON.parse(localStorage.getItem(LS_KEY) || '{}') || {}; } catch (_) {}
  const clamp = TimerCore.clampSec;
  const sec = (v) => { const n = Number(v); return Number.isFinite(n) ? clamp(n) : null; };
  const num = (v, lo, hi) => { const n = Number(v); return Number.isFinite(n) ? Math.max(lo, Math.min(hi, n)) : null; };
  let x;
  if ((x = sec(raw.talkSec)) != null) state.talkSec = Math.max(60, x);
  if ((x = sec(raw.qaSec)) != null) state.qaSec = x;
  if ((x = sec(raw.talkWarnSec)) != null) state.talkWarnSec = x;
  if ((x = sec(raw.talkWarn2Sec)) != null) state.talkWarn2Sec = x;
  if ((x = num(raw.volume, 0, 1)) != null) state.volume = x;
  if ((x = num(raw.pitch, 0.25, 4)) != null) state.pitch = x;
  if ((x = num(raw.bellGap, 0.5, 3)) != null) state.bellGap = x;
  if (TimerCore.SOUNDS.includes(raw.bellSound)) state.bellSound = raw.bellSound;
  if (['ja', 'en'].includes(raw.lang)) state.lang = raw.lang;
  if (['phase', 'total'].includes(raw.clockScope)) state.clockScope = raw.clockScope;
  const ps = TimerCore.normalizePresets(raw.presets);
  if (ps) state.presets = ps;
  if (typeof raw.soundOn === 'boolean') soundOn = raw.soundOn;
  state.remainingSec = state.talkSec;
  lang = state.lang;
}
function save() {
  const out = { soundOn };
  for (const k of TimerCore.CONFIG_KEYS) out[k] = state[k];
  try { localStorage.setItem(LS_KEY, JSON.stringify(out)); } catch (_) {}
}

function ring(type) { if (soundOn && window.Bell) Bell.ring(type, state.bellSound); }

// ---- コマンド＝コアに委譲（server.js と同一ロジック）----
function cmd(obj) {
  const r = TimerCore.applyCommand(state, obj);
  if (!r.ok) return;
  for (const b of r.bells) ring(b);
  if (r.persist) save();
  render();
}

// ---- 毎秒の tick（コア）----
setInterval(() => {
  const bells = TimerCore.tick(state);
  for (const b of bells) ring(b);
  render();
}, 1000);
// 超過点滅
setInterval(() => {
  const d = $('display');
  if (d.classList.contains('over')) { blinkOn = !blinkOn; d.classList.toggle('blink', blinkOn); }
  else d.classList.remove('blink');
}, 600);

function fmt(sec) {
  const over = sec < 0; const a = Math.abs(sec);
  return { over, body: String(Math.floor(a / 60)).padStart(2, '0') + ':' + String(a % 60).padStart(2, '0') };
}

function render() {
  const st = state, d = t(), en = lang === 'en';
  if (window.Bell) { Bell.setVolume(st.volume); Bell.setPitch(st.pitch); Bell.setGap(st.bellGap); }
  const totalRem = st.segment === 'qa' ? st.remainingSec : st.remainingSec + st.qaSec;
  const scopeTotal = st.clockScope === 'total';
  const bigSec = scopeTotal ? totalRem : st.remainingSec;
  const { over, body } = fmt(bigSec);
  $('clock').innerHTML = (over ? '<span class="sign">+</span>' : '') + body;

  // 色：緑→黄（予鈴以下・講演のみ）→赤（超過）
  const warnSec = st.segment === 'talk' ? Math.max(st.talkWarnSec || 0, st.talkWarn2Sec || 0) : 60; // 質疑は残り60秒で黄
  const disp = $('display'); disp.classList.remove('warn', 'over');
  if (scopeTotal && st.segment === 'talk') { if (totalRem <= 0) disp.classList.add('over'); }
  else if (st.remainingSec <= 0) disp.classList.add('over');
  else if (warnSec > 0 && st.remainingSec <= warnSec) disp.classList.add('warn');

  const hasQa = st.qaSec > 0;
  document.querySelector('#segment .badge').textContent = st.segment === 'qa' ? d.qa : d.talk;

  const totalEl = $('total');
  if (hasQa && st.segment === 'talk') {
    if (scopeTotal) { const p = fmt(st.remainingSec); totalEl.textContent = (en ? 'Talk left ' : '講演のこり ') + (p.over ? '+' : '') + p.body; }
    else { const tot = fmt(totalRem); totalEl.textContent = (en ? 'Total ' : '全体のこり ') + (tot.over ? '+' : '') + tot.body + (en ? ' (incl. Q&A)' : '（質疑応答こみ）'); }
    totalEl.style.visibility = 'visible';
  } else totalEl.style.visibility = 'hidden';

  $('status').textContent = st.phase === 'running' ? (over ? d.over : '') : st.phase === 'paused' ? d.paused : d.standby;

  const endEl = $('endtime');
  if (st.phase === 'running') {
    const end = new Date(Date.now() + totalRem * 1000);
    endEl.textContent = (en ? 'Ends ~ ' : '終了予定 ') + String(end.getHours()).padStart(2, '0') + ':' + String(end.getMinutes()).padStart(2, '0');
    endEl.style.visibility = 'visible';
  } else endEl.style.visibility = 'hidden';

  const msg = $('message');
  if (st.message) {
    if (msg.textContent !== st.message) { msg.textContent = st.message; msg.style.animation = 'none'; void msg.offsetWidth; msg.style.animation = ''; }
    msg.classList.add('show');
  } else msg.classList.remove('show');
  $('msgActive').textContent = st.message ? (en ? 'Showing: ' : '表示中: ') + st.message : '';

  // 操作部の状態
  const running = st.phase === 'running';
  const pp = $('btnPlayPause');
  pp.textContent = running ? ('⏸ ' + d.pause) : ('▶ ' + d.start);
  pp.classList.toggle('primary', !running); pp.classList.toggle('muted', running);
  $('btnReset').disabled = running;            // 進行中はリセット不可
  $('btnToQa').disabled = !hasQa || st.segment === 'qa';
  const panel = $('panel');
  panel.classList.toggle('running', running);
  panel.classList.toggle('idle', st.phase === 'idle');

  // サマリー値
  const m = (n) => (Math.round(n / 60 * 10) / 10) + d.minU;
  $('valTalk').textContent = m(st.talkSec); $('valQa').textContent = m(st.qaSec);
  $('valTotal').textContent = m(st.talkSec + st.qaSec);
  $('valTalkWarn').textContent = m(st.talkWarnSec); $('valTalkWarn2').textContent = m(st.talkWarn2Sec);

  // ベル音ボタン・スライダー
  document.querySelectorAll('#bellSounds button').forEach((b) => b.classList.toggle('active', b.dataset.sound === st.bellSound));
  const vs = $('volSlider'); if (document.activeElement !== vs) { vs.value = st.volume; showVol(st.volume); }
  const ps2 = $('pitchSlider'); if (document.activeElement !== ps2) { ps2.value = ratioToSemi(st.pitch); showPitch(ratioToSemi(st.pitch)); }
  const gs = $('gapSlider'); if (document.activeElement !== gs) { gs.value = st.bellGap; showGap(st.bellGap); }
  const bs = $('btnSound'); bs.textContent = soundOn ? d.soundOn : d.soundOff; bs.classList.toggle('on', soundOn);

  // プリセットは変化時だけ作り直す
  const psig = JSON.stringify(st.presets || []);
  if (psig !== lastPresetsSig) { lastPresetsSig = psig; buildPresets(); renderPresetList(); }
}

// ---- i18n 適用（言語非依存テキストの差し込み＋言語依存ボタン）----
function applyLang() {
  const d = t();
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach((el) => { const k = el.dataset.i18n; if (d[k]) el.textContent = d[k]; });
  $('btnReset').textContent = d.reset;
  $('btnToQa').textContent = d.toQa;
  $('ovTitle').textContent = d.ovTitle; $('ovHint').textContent = d.ovHint;
  $('langJa').classList.toggle('active', lang === 'ja');
  $('langEn').classList.toggle('active', lang === 'en');
  buildQuick(); buildBellSounds();
  render();
}
function buildQuick() {
  const wrap = $('quickMsgs'); wrap.innerHTML = '';
  t().quick.forEach((text) => { const b = document.createElement('button'); b.textContent = text; b.onclick = () => cmd({ action: 'message', text }); wrap.appendChild(b); });
}
function buildBellSounds() {
  const wrap = $('bellSounds'); if (!wrap || !window.Bell) return;
  wrap.innerHTML = '';
  Bell.ORDER.forEach((name) => {
    const b = document.createElement('button'); b.className = 'muted' + (name === state.bellSound ? ' active' : '');
    b.dataset.sound = name; b.textContent = (Bell.LABELS[name] && Bell.LABELS[name][lang]) || name;
    b.onclick = () => { cmd({ action: 'setBellSound', sound: name }); if (window.Bell) { Bell.unlock(); Bell.ring('warn', name); } };
    wrap.appendChild(b);
  });
}
function buildPresets() {
  const wrap = $('presets'); wrap.innerHTML = '';
  (state.presets || []).forEach(([tk, qa, tw, tw2]) => {
    const b = document.createElement('button'); b.textContent = qa > 0 ? `${tk}+${qa}` : `${tk}`;
    b.onclick = () => cmd({ action: 'set', talkMin: tk, qaMin: qa, talkWarnMin: tw, talkWarn2Min: tw2 });
    wrap.appendChild(b);
  });
}
function renderPresetList() {
  const wrap = $('presetList'); const d = t(); wrap.innerHTML = '';
  const presets = state.presets || [];
  presets.forEach(([tk, qa, tw, tw2], i) => {
    const row = document.createElement('div'); row.className = 'presetrow';
    const chip = document.createElement('button'); chip.className = 'presetchip';
    chip.textContent = `${tk}+${qa}（${d.warnShort} ${tw}/${tw2}）`;
    chip.onclick = () => cmd({ action: 'set', talkMin: tk, qaMin: qa, talkWarnMin: tw, talkWarn2Min: tw2 });
    const del = document.createElement('button'); del.className = 'presetdel'; del.textContent = '✕';
    del.onclick = () => {
      const label = `${tk}+${qa}`;
      if (!window.confirm(lang === 'en' ? `Delete preset "${label}"?` : `プリセット「${label}」を削除しますか？`)) return;
      const next = presets.slice(); next.splice(i, 1); cmd({ action: 'setPresets', presets: next });
    };
    row.appendChild(chip); row.appendChild(del); wrap.appendChild(row);
  });
}

// ---- 操作ハンドラ ----
$('btnPlayPause').onclick = () => cmd({ action: state.phase === 'running' ? 'pause' : 'start' });
$('btnReset').onclick = () => { if (state.phase !== 'running') cmd({ action: 'reset' }); };
$('btnToQa').onclick = () => cmd({ action: 'segment', to: 'qa' });
$('btnMsgClear').onclick = () => cmd({ action: 'clearMessage' });
$('clock').onclick = () => { if (state.qaSec > 0) cmd({ action: 'setClockScope', scope: state.clockScope === 'total' ? 'phase' : 'total' }); };

document.querySelectorAll('.setSummary .step').forEach((btn) => {
  btn.onclick = () => {
    let talk = Math.round(state.talkSec / 60), qa = Math.round(state.qaSec / 60);
    let w1 = Math.round(state.talkWarnSec / 60), w2 = Math.round(state.talkWarn2Sec / 60);
    const dir = Number(btn.dataset.dir);
    switch (btn.dataset.dim) {
      case 'qa': qa = Math.max(0, qa + dir); break;
      case 'talkWarn': w1 = Math.max(0, w1 + dir); break;
      case 'talkWarn2': w2 = Math.max(0, w2 + dir); break;
      default: talk = Math.max(1, talk + dir); // talk と total はどちらも講演を増減
    }
    cmd({ action: 'set', talkMin: talk, qaMin: qa, talkWarnMin: w1, talkWarn2Min: w2 });
  };
});
document.querySelectorAll('[data-adj]').forEach((b) => b.onclick = () => cmd({ action: 'adjust', deltaSec: Number(b.dataset.adj) }));

// 音量：ドラッグ中はローカル反映＋数値表示、離したら保存＋試聴
function showVol(v) { $('volVal').textContent = `${Math.round(Number(v) * 100)}%`; }
$('volSlider').addEventListener('input', () => { showVol($('volSlider').value); if (window.Bell) Bell.setVolume(Number($('volSlider').value)); });
$('volSlider').addEventListener('change', () => { cmd({ action: 'setVolume', value: Number($('volSlider').value) }); if (window.Bell) { Bell.unlock(); Bell.ring('warn', state.bellSound); } });
// 高さ（ピッチ）：スライダーは半音（−12〜+12）、保存値は周波数倍率 2^(半音/12)。ダブルタップで標準（0）に戻す。
function semiToRatio(st) { return Math.pow(2, Number(st) / 12); }
function ratioToSemi(r) { return Math.max(-12, Math.min(12, Math.round(12 * Math.log2(Number(r) || 1)))); }
function showPitch(semi) { $('pitchVal').textContent = `${semi > 0 ? '+' : ''}${semi} ${t().semi}（×${semiToRatio(semi).toFixed(2)}）`; }
$('pitchSlider').addEventListener('input', () => { showPitch(Number($('pitchSlider').value)); if (window.Bell) Bell.setPitch(semiToRatio($('pitchSlider').value)); });
$('pitchSlider').addEventListener('change', () => { cmd({ action: 'setPitch', value: semiToRatio($('pitchSlider').value) }); if (window.Bell) { Bell.unlock(); Bell.ring('warn', state.bellSound); } });
$('pitchSlider').addEventListener('dblclick', () => { $('pitchSlider').value = 0; $('pitchSlider').dispatchEvent(new Event('change')); });
// 2鈴・3鈴の間隔：音色ごとの基準間隔 × 倍率（0.5〜3）。表示は選択中の音色での実秒。離したら保存＋2鈴で試聴。
function showGap(g) { $('gapVal').textContent = `×${Number(g).toFixed(1)}（${window.Bell ? Bell.interval(state.bellSound).toFixed(2) : '-'} ${t().secU}）`; }
$('gapSlider').addEventListener('input', () => { if (window.Bell) Bell.setGap(Number($('gapSlider').value)); showGap($('gapSlider').value); });
$('gapSlider').addEventListener('change', () => { cmd({ action: 'setBellGap', value: Number($('gapSlider').value) }); if (window.Bell) { Bell.unlock(); Bell.ring('talkEnd', state.bellSound); } });
$('gapSlider').addEventListener('dblclick', () => { $('gapSlider').value = 1; $('gapSlider').dispatchEvent(new Event('change')); });

$('btnSavePreset').onclick = () => {
  const r = (s) => Math.round((s || 0) / 60);
  const next = (state.presets || []).slice();
  next.push([r(state.talkSec), r(state.qaSec), r(state.talkWarnSec), r(state.talkWarn2Sec)]);
  cmd({ action: 'setPresets', presets: next });
};

$('btnSound').onclick = () => { soundOn = !soundOn; if (soundOn && window.Bell) { Bell.unlock(); Bell.ring('warn', state.bellSound); } save(); render(); };
// 手動ベル（🔔1/🔔2/🔔3）＝明示操作なので soundOn ゲートを通さず必ず鳴らす（押下が音声解錠の gesture を兼ねる）
document.querySelectorAll('[data-bell]').forEach((b) => b.onclick = () => {
  if (window.Bell) { Bell.unlock(); Bell.ring(b.dataset.bell, state.bellSound); }
});
function setLang(l) { lang = l; cmd({ action: 'setLang', lang: l }); applyLang(); }
$('langJa').onclick = () => setLang('ja');
$('langEn').onclick = () => setLang('en');

// クリック後はフォーカスを外す＝スペース等の二重発火防止
document.addEventListener('click', (e) => { if (e.target.tagName === 'BUTTON') e.target.blur(); });
document.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'textarea') return;
  if (window.Bell) Bell.unlock(); // キー操作も音声解錠の gesture にする（デスクトップでキーボードのみ操作した時に無音になるのを防ぐ）
  let handled = true;
  switch (e.code) {
    case 'Space': cmd({ action: state.phase === 'running' ? 'pause' : 'start' }); break;
    case 'KeyR': if (state.phase !== 'running') cmd({ action: 'reset' }); break;
    case 'KeyQ': cmd({ action: 'segment', to: 'qa' }); break;
    case 'KeyT': cmd({ action: 'segment', to: 'talk' }); break;
    case 'ArrowRight': cmd({ action: 'adjust', deltaSec: 10 }); break;
    case 'ArrowLeft': cmd({ action: 'adjust', deltaSec: -10 }); break;
    case 'ArrowUp': cmd({ action: 'adjust', deltaSec: 60 }); break;
    case 'ArrowDown': cmd({ action: 'adjust', deltaSec: -60 }); break;
    default: handled = false;
  }
  if (handled) e.preventDefault();
});

// ---- スリープ防止・音声解錠・全画面 ----
let wakeLock = null;
async function acquireWakeLock() {
  try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (_) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { acquireWakeLock(); if (window.Bell) Bell.unlock(); } });
function goFullscreen() { const el = document.documentElement; if (el.requestFullscreen) el.requestFullscreen().catch(() => {}); }
$('btnFs').onclick = goFullscreen;
document.addEventListener('pointerdown', () => { if (window.Bell) Bell.unlock(); acquireWakeLock(); });
$('overlay').onclick = () => {
  if (window.Bell) Bell.unlock(); // 解錠のみ（確認音は鳴らさない＝接続時に鳴ってうるさいため）
  $('overlay').classList.add('hidden'); acquireWakeLock(); goFullscreen();
};

// ---- 起動 ----
load();
applyLang();   // render も呼ぶ
acquireWakeLock();

// PWA：Service Worker 登録。HTTPS（または localhost）でのみ成立。
// 平文 HTTP の LAN IP（Mac サーバ）や file:// では 'serviceWorker' が無いか失敗するが無害（オンライン動作には影響なし）。
// オフライン化は HTTPS 配信（GitHub Pages 等）で「ホーム画面に追加」した時に効く。相対パスで登録＝サブパス配信でもOK。
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>
