# iPad 単体モード（PWA）を GitHub Pages（HTTPS）に配信するワークフロー。
# public/ をそのまま Pages サイトとして公開する → https://<user>.github.io/<repo>/solo.html
# 有効化：リポジトリを push 後、Settings → Pages → Source を「GitHub Actions」にする。
# （push するまでは何も起きない。PWA は HTTPS でのみオフライン化できるため Pages を使う）
name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true   # Pages 未有効でも自動で有効化（初回 push で一発デプロイ）
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
