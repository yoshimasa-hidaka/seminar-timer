# 3 OS（Linux / Windows / macOS）で単体テストとサーバの起動確認を回す。
# 手元に Windows・Linux の実機が無くても、LAN IP 推定（route / ip コマンドの実出力）と
# サーバの起動・配信・SSE が各 OS で動くことをここで確かめる。
name: Test (Linux / Windows / macOS)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Unit tests (platform.js)
        run: node test/platform.test.js
      - name: Server smoke test (start, serve pages, SSE, command)
        run: node test/server.smoke.js
      - name: Show what this runner detects (for the log)
        run: node -e "const P=require('./platform.js'); console.log(process.platform, JSON.stringify(P.detectLanIp()), 'hint', JSON.stringify(P.defaultRouteHint()))"
