<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>講演タイマー — 操作</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #1b1d21; color: #eee;
    font-family: -apple-system, "Hiragino Sans", system-ui, sans-serif;
    padding: 16px; max-width: 720px; margin: 0 auto;
  }
  h2 { font-size: 15px; color: #9aa; margin: 20px 0 8px; font-weight: 600; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
  .toggle button {
    flex: none; min-width: 0; padding: 8px 14px; font-size: 14px;
    background: #2e3238; border-radius: 8px 0 0 8px;
  }
  .toggle button + button { border-radius: 0 8px 8px 0; }
  .toggle button.active { background: #2e7d32; }
  #btnMacBell { border-radius: 8px; }
  .clock {
    text-align: center; font-variant-numeric: tabular-nums; font-weight: 800;
    font-size: 64px; padding: 10px; border-radius: 12px; margin-bottom: 4px;
    background: #0a7d32; transition: background-color .3s;
  }
  .clock.warn { background: #c79100; }
  .clock.over { background: #b3151f; }
  .sub { text-align: center; color: #9aa; margin-bottom: 4px; min-height: 18px; }
  .endt { text-align: center; color: #7d8590; margin-bottom: 12px; min-height: 16px; font-variant-numeric: tabular-nums; font-size: 14px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    flex: 1; min-width: 64px; padding: 16px 10px; font-size: 17px; font-weight: 600;
    border: none; border-radius: 10px; background: #2e3238; color: #eee; cursor: pointer;
  }
  button:active { transform: scale(.97); }
  button.primary { background: #2e7d32; }
  /* 再生中は時間設定の項目ごと非表示（上部サマリー・プリセット・個別設定） */
  body.running #schedule,
  body.running #presetBlock,
  body.running #setBlock { display: none; }
  .cBadge { text-align: center; font-size: 15px; font-weight: 700; color: #cdd; margin-bottom: 4px; }
  .cTotal { text-align: center; font-size: 15px; color: #9aa; margin: 4px 0; min-height: 18px;
    font-variant-numeric: tabular-nums; }
  .cTotal .endinline { opacity: .8; }
  .clock { cursor: pointer; }
  .big { font-size: 20px; padding: 20px; }
  input {
    width: 100%; padding: 12px; font-size: 16px; border-radius: 8px;
    border: 1px solid #444; background: #111; color: #eee;
  }
  .field { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .field label { width: 11em; color: #9aa; font-size: 14px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; }
  .quick button, .preset button { background: #353a44; font-size: 15px; padding: 12px 8px; }
  .muted { background: #2e3238; }
  details { margin-top: 18px; border-top: 1px solid #2e3238; padding-top: 6px; }
  summary { cursor: pointer; color: #9aa; font-size: 15px; font-weight: 600; padding: 8px 0; }
  .hint { color: #6b7280; font-size: 12px; line-height: 1.7; }
  #conn { text-align: center; margin-top: 6px; }
  #qr { background: #fff; border-radius: 8px; padding: 8px; margin-top: 8px; }
  #connUrl { font-variant-numeric: tabular-nums; color: #cdd; font-size: 14px; word-break: break-all; }
  .connbar { text-align: center; font-size: 13px; color: #7d8590; margin: 2px 0 10px; cursor: pointer; }
  .connbar b { color: #8fd0a0; font-weight: 600; font-variant-numeric: tabular-nums; }
  #btnMacBell.on { background: #2e7d32; }
  #btnReset { flex: none; padding: 9px 18px; font-size: 14px; }
  .msgActive { text-align: center; font-size: 14px; min-height: 20px; margin-top: 10px; color: #e0b34a; }
  #schedule { -webkit-user-select: none; user-select: none; }
  .setSummary { display: flex; gap: 8px; margin: 6px 0 4px; }
  .setSummary > div { flex: 1; text-align: center; background: #23262b; border-radius: 8px; padding: 8px 4px; }
  .setSummaryHint { text-align: center; font-size: 11px; color: #6b7280; margin: 2px 0 12px; cursor: pointer; }
  .setSummary > div > span { display: block; font-size: 12px; color: #9aa; margin-bottom: 2px; }
  .setSummary .stepRow { display: flex; align-items: center; justify-content: center; gap: 4px; }
  .setSummary .stepRow b { font-size: 18px; font-variant-numeric: tabular-nums; min-width: 3.4em; }
  .setSummary .step { flex: none; width: 30px; min-width: 30px; padding: 6px 0; font-size: 16px; background: #3a3f47; border-radius: 6px; }
  .setSummary .tot { background: #2e7d32; }
  .setSummary .tot b { color: #fff; }
  .setSummary .tot .step { background: #256528; }
  .scopeRow { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 6px 0 2px; }
  .scopeRow > span { font-size: 12px; color: #9aa; }
  .scopeRow .seg { flex: none; padding: 5px 12px; font-size: 12px; background: #2e3238; border-radius: 6px; }
  .scopeRow .seg.active { background: #2e7d32; }
</style>
</head>
<body>
  <div class="topbar">
    <button id="btnMacBell" class="muted" style="flex:none" data-i18n="macBellOff"></button>
    <div class="toggle row" style="flex:none">
      <button id="langJa" class="active">日本語</button>
      <button id="langEn">English</button>
    </div>
  </div>

  <div class="connbar" id="connbar"></div>
  <div class="cBadge" id="ctlBadge"></div>
  <div class="clock" id="clock">--:--</div>
  <div class="cTotal" id="ctlTotal"></div>
  <div class="sub" id="sub"></div>

  <div class="row">
    <button class="primary big" id="btnStart" data-i18n="start"></button>
    <button class="big muted" id="btnPause" data-i18n="pause"></button>
  </div>
  <div class="row" style="margin-top:8px; justify-content:flex-end">
    <button class="muted" id="btnReset" data-i18n="reset"></button>
  </div>

  <div id="schedule">
    <div class="setSummary">
      <div>
        <span data-i18n="sumTalk"></span>
        <div class="stepRow">
          <button class="step" data-dim="talk" data-dir="-1">−</button>
          <b id="valTalk">–</b>
          <button class="step" data-dim="talk" data-dir="1">＋</button>
        </div>
      </div>
      <div>
        <span data-i18n="sumQa"></span>
        <div class="stepRow">
          <button class="step" data-dim="qa" data-dir="-1">−</button>
          <b id="valQa">–</b>
          <button class="step" data-dim="qa" data-dir="1">＋</button>
        </div>
      </div>
      <div class="tot">
        <span data-i18n="sumTotal"></span>
        <div class="stepRow">
          <button class="step" data-dim="total" data-dir="-1">−</button>
          <b id="valTotal">–</b>
          <button class="step" data-dim="total" data-dir="1">＋</button>
        </div>
      </div>
    </div>
    <div class="setSummaryHint" id="setHint" data-i18n="setHint"></div>
  </div>

  <h2 data-i18n="phaseH"></h2>
  <div class="grid2">
    <button id="btnToTalk" class="muted" data-i18n="toTalk"></button>
    <button id="btnToQa" class="primary" data-i18n="toQa"></button>
  </div>

  <h2 data-i18n="adjustH"></h2>
  <div class="grid4">
    <button data-adj="-60" data-i18n="m1"></button>
    <button data-adj="-10" data-i18n="s10m"></button>
    <button data-adj="10" data-i18n="s10p"></button>
    <button data-adj="60" data-i18n="p1"></button>
  </div>

  <h2 data-i18n="msgH"></h2>
  <div class="field"><input id="msg"></div>
  <div class="grid2">
    <button id="btnMsgSend" class="primary" data-i18n="send"></button>
    <button id="btnMsgClear" class="muted" data-i18n="clear"></button>
  </div>
  <div class="grid2 quick" id="quickMsgs" style="margin-top:8px"></div>
  <div class="msgActive" id="msgActive"></div>

  <details>
    <summary data-i18n="moreH"></summary>

    <div id="presetBlock">
      <h2 data-i18n="presetH"></h2>
      <div class="grid4 preset" id="presets"></div>
    </div>

    <div id="setBlock">
      <h2 data-i18n="setH"></h2>
      <div class="field"><label data-i18n="lblTitle"></label><input id="setTitle"></div>
      <div class="field"><label data-i18n="lblTalk"></label><input id="setTalk" type="number" inputmode="decimal" value="20"></div>
      <div class="field"><label data-i18n="lblQa"></label><input id="setQa" type="number" inputmode="decimal" value="10"></div>
      <div class="field"><label data-i18n="lblTalkWarn"></label><input id="setTalkWarn" type="number" inputmode="decimal" value="5"></div>
      <div class="field"><label data-i18n="lblQaWarn"></label><input id="setQaWarn" type="number" inputmode="decimal" value="2"></div>
      <button class="primary" id="btnSet" data-i18n="applySet"></button>
    </div>
    <div id="setRunNote" class="setSummaryHint" data-i18n="setHintRunning" style="display:none"></div>

    <h2 data-i18n="connH"></h2>
    <div id="conn">
      <div id="connUrl"></div>
      <canvas id="qr" width="0" height="0"></canvas>
    </div>

    <h2 data-i18n="bellH"></h2>
    <div class="row">
      <button data-bell="warn" class="muted" data-i18n="bellWarn"></button>
      <button data-bell="talkEnd" class="muted" data-i18n="bellTalkEnd"></button>
      <button data-bell="final" class="muted" data-i18n="bellFinal"></button>
    </div>

    <h2 data-i18n="keyH"></h2>
    <div class="hint" data-i18n="keyHint"></div>
  </details>

<script src="qr.js"></script>
<script>
const I18N = {
  ja: {
    start: '開始 / 再開', pause: '一時停止', reset: 'リセット',
    phaseH: 'フェーズ切替', toTalk: '講演に戻す', toQa: '質疑応答へ',
    adjustH: '時間調整', m1: '−1分', s10m: '−10秒', s10p: '+10秒', p1: '+1分',
    msgH: 'メッセージを iPad に表示', send: '送信', clear: '消す',
    moreH: '詳細設定（プリセット・時間・ベル・接続）',
    presetH: 'プリセット（講演＋質疑）',
    setH: '個別に設定',
    lblTitle: '講演タイトル', lblTalk: '講演（分）', lblQa: '質疑応答（分）',
    lblTalkWarn: '講演の予鈴（終了何分前）', lblQaWarn: '質疑の予鈴（終了何分前）',
    titlePh: '例：山田さんの講演', msgPh: 'speaker に伝える一言',
    applySet: 'この設定を反映（リセット）',
    bellH: 'ベル確認', bellWarn: '1鈴（予鈴）', bellTalkEnd: '2鈴（講演終了）', bellFinal: '3鈴（全体終了）',
    connH: 'iPad の接続（QR）', keyH: 'キーボード操作（Mac）',
    keyHint: 'スペース＝開始/一時停止　R＝リセット　Q＝質疑へ　T＝講演に戻す　←/→＝±10秒　↑/↓＝±1分',
    macBellOn: '🔔 Mac音 オン', macBellOff: '🔕 Mac音 オフ',
    connPrefix: '📱 iPad で開く', connTapHint: '（タップで QR）',
    msgShowing: '表示中', msgNone: '',
    sumTalk: '講演', sumQa: '質疑', sumTotal: '全体', minU: '分',
    scopeLabel: 'iPad の大きい表示', scopePhase: '現フェーズ', scopeTotal: '全体',
    setHint: '−／＋ で時間調整・ダブルクリックでプリセット',
    setHintRunning: '⏸ 進行中は時間設定できません（一時停止すると変更可）',
    lockMsg: '一時停止してから操作してください',
    running: '進行中', paused: '一時停止中', standby: '待機中', talk: '講演', qa: '質疑応答',
    endRun: '終了予定', endIdle: '開始すると終了予定を表示',
    quick: ['あと5分です', 'あと1分です', 'そろそろまとめてください', '時間です'],
  },
  en: {
    start: 'Start / Resume', pause: 'Pause', reset: 'Reset',
    phaseH: 'Switch phase', toTalk: 'Back to talk', toQa: 'Go to Q&A',
    adjustH: 'Adjust time', m1: '−1 min', s10m: '−10 s', s10p: '+10 s', p1: '+1 min',
    msgH: 'Show message on iPad', send: 'Send', clear: 'Clear',
    moreH: 'More (presets, durations, bells, connection)',
    presetH: 'Presets (talk + Q&A)',
    setH: 'Set individually',
    lblTitle: 'Talk title', lblTalk: 'Talk (min)', lblQa: 'Q&A (min)',
    lblTalkWarn: 'Talk warning (min before end)', lblQaWarn: 'Q&A warning (min before end)',
    titlePh: 'e.g. Dr. Yamada’s talk', msgPh: 'a note to the speaker',
    applySet: 'Apply settings (reset)',
    bellH: 'Bell check', bellWarn: '1 bell (warning)', bellTalkEnd: '2 bells (talk end)', bellFinal: '3 bells (end)',
    connH: 'iPad connection (QR)', keyH: 'Keyboard (Mac)',
    keyHint: 'Space = start/pause   R = reset   Q = to Q&A   T = back to talk   ←/→ = ±10 s   ↑/↓ = ±1 min',
    macBellOn: '🔔 Mac sound ON', macBellOff: '🔕 Mac sound OFF',
    connPrefix: '📱 Open on iPad', connTapHint: '(tap for QR)',
    msgShowing: 'Showing', msgNone: '',
    sumTalk: 'Talk', sumQa: 'Q&A', sumTotal: 'Total', minU: ' min',
    scopeLabel: 'iPad big display', scopePhase: 'Current part', scopeTotal: 'Total',
    setHint: '−/＋ to adjust · double-click for presets',
    setHintRunning: '⏸ Pause to change durations (disabled while running)',
    lockMsg: 'Pause first to change settings',
    running: 'Running', paused: 'Paused', standby: 'Standby', talk: 'Talk', qa: 'Q&A',
    endRun: 'Ends', endIdle: 'End time shows once started',
    quick: ['5 minutes left', '1 minute left', 'Please wrap up', 'Time is up'],
  },
};
const PRESETS = [ [20,10], [30,15], [45,15], [60,0] ]; // [講演分, 質疑分]

let lang = 'ja';
let lastState = null;
let qrDrawnFor = '';      // 同じ URL で再描画しない
let macBell = false;      // F: Mac でもベルを鳴らす
let audioCtx = null;
let lastBellId = null;    // null=基準未取得（初回は鳴らさない）
let settingsSynced = false; // 初回の状態で設定欄を実値に同期したか

function t() { return I18N[lang]; }

function applyLang() {
  const d = t();
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.dataset.i18n;
    if (k === 'macBellOff') { el.textContent = macBell ? d.macBellOn : d.macBellOff; el.classList.toggle('on', macBell); return; }
    if (d[k]) el.textContent = d[k];
  });
  document.getElementById('setTitle').placeholder = d.titlePh;
  document.getElementById('msg').placeholder = d.msgPh;
  document.getElementById('langJa').classList.toggle('active', lang === 'ja');
  document.getElementById('langEn').classList.toggle('active', lang === 'en');
  // クイックメッセージ
  const wrap = document.getElementById('quickMsgs');
  wrap.innerHTML = '';
  d.quick.forEach(text => {
    const b = document.createElement('button');
    b.textContent = text;
    b.onclick = () => { document.getElementById('msg').value = text; cmd({ action: 'message', text }); };
    wrap.appendChild(b);
  });
  if (lastState) renderState(lastState);
}

// プリセット（言語非依存・一度だけ生成）。押したら入力欄も埋めてサマリーを更新。
function buildPresets() {
  const wrap = document.getElementById('presets');
  wrap.innerHTML = '';
  PRESETS.forEach(([tk, qa]) => {
    const b = document.createElement('button');
    b.textContent = qa > 0 ? `${tk}+${qa}` : `${tk}`;
    b.onclick = () => {
      document.getElementById('setTalk').value = tk;
      document.getElementById('setQa').value = qa;
      cmd({ action: 'set', talkMin: tk, qaMin: qa,
        talkWarnMin: document.getElementById('setTalkWarn').value,
        qaWarnMin: document.getElementById('setQaWarn').value,
        title: document.getElementById('setTitle').value });
    };
    wrap.appendChild(b);
  });
}

// 設定サマリー：講演／質疑／全体を最上部に常時表示。−／＋で編集可・現在値(サーバ)を反映。
function renderSummary(tkMin, qaMin) {
  const d = t();
  const m = (n) => (Math.round(n * 10) / 10) + d.minU;
  document.getElementById('valTalk').textContent = m(tkMin);
  document.getElementById('valQa').textContent = m(qaMin);
  document.getElementById('valTotal').textContent = m(tkMin + qaMin);
}

// B/C: −／＋ で講演・質疑・全体を編集（全体± は質疑固定で講演に反映＝C）。set で確定。
document.querySelectorAll('.setSummary .step').forEach((btn) => {
  btn.ondblclick = (e) => e.stopPropagation();   // ＋連打でプリセットを開かない
  btn.onclick = (e) => {
    e.stopPropagation();
    if (!lastState) return;
    let talk = Math.round(lastState.talkSec / 60);
    let qa = Math.round(lastState.qaSec / 60);
    const dir = Number(btn.dataset.dir);
    if (btn.dataset.dim === 'qa') qa = Math.max(0, qa + dir);
    else talk = Math.max(1, talk + dir);          // 'talk' と 'total' はどちらも講演を増減
    document.getElementById('setTalk').value = talk;
    document.getElementById('setQa').value = qa;
    cmd({ action: 'set', talkMin: talk, qaMin: qa,
      talkWarnMin: document.getElementById('setTalkWarn').value,
      qaWarnMin: document.getElementById('setQaWarn').value,
      title: document.getElementById('setTitle').value });
  };
});

// A: 大きい数字をクリック → スコープ（現フェーズ ⇄ 全体）を切替
document.getElementById('clock').onclick = () => {
  if (!lastState || !(lastState.qaSec > 0)) return;
  cmd({ action: 'setClockScope', scope: lastState.clockScope === 'total' ? 'phase' : 'total' });
};

async function cmd(obj) {
  await fetch('/api/cmd', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(obj),
  });
}
function fmt(sec) {
  const a = Math.abs(sec);
  const b = String(Math.floor(a/60)).padStart(2,'0') + ':' + String(a%60).padStart(2,'0');
  return (sec < 0 ? '+' : '') + b;
}

// --- F: Mac での発音 ---
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(times, freq, dur) {
  if (!audioCtx) return;
  let tm = audioCtx.currentTime;
  for (let i = 0; i < times; i++) {
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, tm);
    g.gain.exponentialRampToValueAtTime(0.5, tm + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, tm + dur);
    osc.connect(g).connect(audioCtx.destination);
    osc.start(tm); osc.stop(tm + dur);
    tm += dur + 0.18;
  }
}
document.getElementById('btnMacBell').onclick = () => {
  macBell = !macBell;
  if (macBell) ensureAudio();
  const b = document.getElementById('btnMacBell');
  b.textContent = macBell ? t().macBellOn : t().macBellOff;
  b.classList.toggle('on', macBell);
};
// どの操作でも一度オーディオを解錠（自動再生制限の回避）
document.addEventListener('pointerdown', () => { if (macBell) ensureAudio(); }, { once: false });

function setLang(l) { lang = l; applyLang(); cmd({ action: 'setLang', lang: l }); }
document.getElementById('langJa').onclick = () => setLang('ja');
document.getElementById('langEn').onclick = () => setLang('en');

document.getElementById('btnStart').onclick = () => cmd({ action: 'start' });
document.getElementById('btnPause').onclick = () => cmd({ action: 'pause' });
document.getElementById('btnReset').onclick = () => cmd({ action: 'reset' });
document.getElementById('btnToTalk').onclick = () => cmd({ action: 'segment', to: 'talk' });
document.getElementById('btnToQa').onclick = () => cmd({ action: 'segment', to: 'qa' });

document.querySelectorAll('[data-adj]').forEach(b =>
  b.onclick = () => cmd({ action: 'adjust', deltaSec: Number(b.dataset.adj) }));

document.getElementById('btnSet').onclick = () => cmd({
  action: 'set',
  talkMin: document.getElementById('setTalk').value,
  qaMin: document.getElementById('setQa').value,
  talkWarnMin: document.getElementById('setTalkWarn').value,
  qaWarnMin: document.getElementById('setQaWarn').value,
  title: document.getElementById('setTitle').value,
});

document.getElementById('btnMsgSend').onclick = () =>
  cmd({ action: 'message', text: document.getElementById('msg').value });
document.getElementById('btnMsgClear').onclick = () => {
  document.getElementById('msg').value = '';
  cmd({ action: 'clearMessage' });
};
document.querySelectorAll('[data-bell]').forEach(b =>
  b.onclick = () => cmd({ action: 'testBell', type: b.dataset.bell }));

// クリック後はボタンのフォーカスを外す＝スペース等の global ショートカットの二重発火を防ぐ
document.addEventListener('click', (e) => {
  if (e.target.tagName === 'BUTTON') e.target.blur();
});

// --- C: キーボードショートカット ---
document.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return; // 入力中は無視
  const ph = lastState ? lastState.phase : 'idle';
  let handled = true;
  switch (e.code) {
    case 'Space': cmd({ action: ph === 'running' ? 'pause' : 'start' }); break;
    case 'KeyR': cmd({ action: 'reset' }); break;
    case 'KeyQ': cmd({ action: 'segment', to: 'qa' }); break;
    case 'KeyT': cmd({ action: 'segment', to: 'talk' }); break;
    case 'ArrowRight': cmd({ action: 'adjust', deltaSec: 10 }); break;
    case 'ArrowLeft': cmd({ action: 'adjust', deltaSec: -10 }); break;
    case 'ArrowUp': cmd({ action: 'adjust', deltaSec: 60 }); break;
    case 'ArrowDown': cmd({ action: 'adjust', deltaSec: -60 }); break;
    default: handled = false;
  }
  if (handled) e.preventDefault();
});

// --- G: 接続バー（常時表示の URL）＋ QR（詳細設定内）---
function updateConn(st) {
  if (!st.lanIp || !st.port) return;
  const url = `http://${st.lanIp}:${st.port}/display`;
  const d = t();
  const bar = document.getElementById('connbar');
  if (bar.dataset.for !== url + lang) {     // URL か言語が変わった時だけ作り直す
    bar.dataset.for = url + lang;
    bar.innerHTML = '';
    bar.append(document.createTextNode(d.connPrefix + ' : '));
    const b = document.createElement('b'); b.textContent = url; bar.appendChild(b);
    bar.append(document.createTextNode(' ' + d.connTapHint));
  }
  if (url !== qrDrawnFor) {                  // QR は URL が変わった時だけ描画
    qrDrawnFor = url;
    document.getElementById('connUrl').textContent = url;
    if (window.renderQR) { try { window.renderQR(document.getElementById('qr'), url, 6, 4); } catch (_) {} }
  }
}
// 接続バーをタップ → 詳細設定を開いて QR まで表示
document.getElementById('connbar').onclick = () => {
  const det = document.querySelector('details');
  if (det) det.open = true;
  document.getElementById('qr').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
// サマリー（講演/質疑/全体）をダブルクリック → 詳細設定を開いてプリセットを先頭に表示
document.getElementById('schedule').ondblclick = () => {
  const det = document.querySelector('details');
  if (det) det.open = true;
  document.getElementById('presets').scrollIntoView({ behavior: 'smooth', block: 'center' });
};

function renderState(st) {
  const d = t();
  const en = lang === 'en';
  // iPad と同じ表示：バッジ＋スコープ反映の大きい数字＋副表示（クリックで切替）
  const totalRem = st.segment === 'qa' ? st.remainingSec : st.remainingSec + st.qaSec;
  const scopeTotal = st.clockScope === 'total';
  const bigSec = scopeTotal ? totalRem : st.remainingSec;
  const c = document.getElementById('clock');
  c.textContent = fmt(bigSec);
  c.classList.remove('warn', 'over');
  const warnSec = st.segment === 'qa' ? st.qaWarnSec : st.talkWarnSec;
  if (scopeTotal) { if (totalRem <= 0) c.classList.add('over'); }
  else if (st.remainingSec <= 0) c.classList.add('over');
  else if (warnSec > 0 && st.remainingSec <= warnSec) c.classList.add('warn');

  const seg = st.segment === 'qa' ? d.qa : d.talk;
  document.getElementById('ctlBadge').textContent = '【' + seg + '】';

  // 副表示：もう一方のスコープ＋終了予定を同じ行に。講演フェーズだけスコープ表示。
  const hasQa = st.qaSec > 0;
  const ct = document.getElementById('ctlTotal');
  const parts = [];
  if (hasQa && st.segment === 'talk') {
    parts.push(scopeTotal
      ? (en ? 'This part ' : 'このフェーズ ') + fmt(st.remainingSec)
      : (en ? 'Total ' : '全体のこり ') + fmt(totalRem) + (en ? ' (incl. Q&A)' : '（質疑応答こみ）'));
  }
  if (st.phase === 'running') {
    const end = new Date(Date.now() + totalRem * 1000);
    const hm = String(end.getHours()).padStart(2, '0') + ':' + String(end.getMinutes()).padStart(2, '0');
    parts.push('<span class="endinline">' + (en ? 'ends ~ ' : '終了予定 ') + hm + '</span>');
  }
  ct.innerHTML = parts.join('　');
  ct.style.visibility = parts.length ? 'visible' : 'hidden';

  document.getElementById('sub').textContent = st.title || '';
  // 最上部のサマリー（講演／質疑／全体）を現在の設定で更新
  if (Number.isFinite(st.talkSec) && Number.isFinite(st.qaSec)) renderSummary(st.talkSec / 60, st.qaSec / 60);

  // 進行中は時間変更 UI（−／＋・プリセット・個別設定）を非表示（CSS body.running）。
  const running = st.phase === 'running';
  document.body.classList.toggle('running', running);
  document.getElementById('setHint').textContent = running ? d.setHintRunning : d.setHint;
  document.getElementById('setRunNote').style.display = running ? '' : 'none';
  // iPad に今表示中のメッセージ（古い message の消し忘れ防止）
  document.getElementById('msgActive').textContent = st.message ? (d.msgShowing + ': ' + st.message) : '';
}

function connect() {
  const es = new EventSource('/events');
  es.onmessage = (e) => {
    try {
      const st = JSON.parse(e.data);
      if (st.lang && st.lang !== lang) { lang = st.lang; applyLang(); }
      // 初回のみ：設定欄をサーバの実値に合わせる（開いた時点の構成が一目で合う）
      if (!settingsSynced) {
        settingsSynced = true;
        if (Number.isFinite(st.talkSec)) document.getElementById('setTalk').value = st.talkSec / 60;
        if (Number.isFinite(st.qaSec)) document.getElementById('setQa').value = st.qaSec / 60;
        if (Number.isFinite(st.talkWarnSec)) document.getElementById('setTalkWarn').value = st.talkWarnSec / 60;
        if (Number.isFinite(st.qaWarnSec)) document.getElementById('setQaWarn').value = st.qaWarnSec / 60;
      }
      // F: Mac でのベル（初回は基準合わせのみ）
      if (st.bellEvent) {
        if (lastBellId === null) lastBellId = st.bellEvent.id;
        else if (st.bellEvent.id > lastBellId) {
          lastBellId = st.bellEvent.id;
          if (macBell && audioCtx) {
            if (st.bellEvent.type === 'warn') beep(1, 880, 0.5);
            else if (st.bellEvent.type === 'talkEnd') beep(2, 660, 0.55);
            else if (st.bellEvent.type === 'final') beep(3, 523, 0.6);
          }
        }
      }
      lastState = st;
      renderState(st);
      updateConn(st);
    } catch(_) {}
  };
  es.onerror = () => { es.close(); setTimeout(connect, 1500); };
}

buildPresets();
applyLang();
connect();
</script>
