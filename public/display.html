<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="講演タイマー">
<title>講演タイマー — 表示</title>
<style>
  :root { --bg: #0a7d32; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: #fff;
    font-family: -apple-system, "Hiragino Sans", system-ui, sans-serif;
    overflow: hidden;
    transition: background-color .4s ease;
    -webkit-user-select: none; user-select: none;
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
  }
  body.warn { --bg: #c79100; }
  body.over { --bg: #b3151f; }
  body.over.blink { --bg: #6e0d14; }

  #title {
    text-align: center; padding: 3vh 4vw 0;
    font-size: 5vh; font-weight: 600; opacity: .92;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    min-height: 5vh;
  }
  #segment {
    text-align: center; padding-top: 1vh;
    font-size: 6vh; font-weight: 800; letter-spacing: .04em;
  }
  #segment .badge {
    display: inline-block; padding: .2em .8em; border-radius: 999px;
    background: rgba(255,255,255,.18);
  }
  #clock {
    flex: 1; display: flex; align-items: center; justify-content: center;
    font-variant-numeric: tabular-nums;
    font-weight: 800; letter-spacing: -.02em;
    font-size: 38vh; line-height: 1;
    cursor: pointer;
  }
  #clock .sign { font-size: 22vh; vertical-align: middle; margin-right: .05em; }
  #total {
    text-align: center; font-size: 5.6vh; font-weight: 700; opacity: .92;
    font-variant-numeric: tabular-nums; min-height: 6vh; padding-bottom: .5vh;
  }
  #status {
    text-align: center; font-size: 4vh; opacity: .85; min-height: 5vh;
  }
  #endtime {
    text-align: center; padding-bottom: 1.5vh; font-size: 3.4vh; opacity: .7;
    font-variant-numeric: tabular-nums; min-height: 4vh;
  }
  #message {
    position: fixed; left: 0; right: 0; top: 0;
    background: #fff; color: #111;
    font-size: 9vh; font-weight: 800; text-align: center;
    padding: 4vh 4vw;
    box-shadow: 0 1vh 3vh rgba(0,0,0,.45);
    transform: translateY(-110%); transition: transform .3s ease;
  }
  #message.show { transform: translateY(0); animation: msgflash .7s ease-in-out 3; }
  @keyframes msgflash { 0%, 100% { background: #fff; } 50% { background: #ffd21e; } }

  #overlay {
    position: fixed; inset: 0; background: #000;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    gap: 4vh; cursor: pointer; z-index: 10;
  }
  #overlay h1 { font-size: 8vh; }
  #overlay p { font-size: 4vh; opacity: .7; }
  #overlay.hidden { display: none; }
  #audiowarn {
    position: fixed; top: 0; left: 50%; transform: translateX(-50%);
    background: #b3151f; color: #fff; font-size: 3.2vh; font-weight: 700;
    padding: 1.2vh 4vw; border-radius: 0 0 14px 14px; z-index: 8; cursor: pointer;
  }
</style>
</head>
<body>
  <div id="audiowarn">🔇 タップで音声をON（鳴らない時は端末の音量/消音も確認）</div>
  <div id="segment"><span class="badge"></span></div>
  <div id="clock">--:--</div>
  <div id="total"></div>
  <div id="status"></div>
  <div id="endtime"></div>
  <div id="message"></div>

  <div id="overlay">
    <h1 id="ovTitle">タップして開始</h1>
    <p id="ovHint">音を鳴らすために最初に一度タップしてください</p>
  </div>

<script src="bell.js"></script>
<script>
let lastBellId = null; // null = 基準未取得（初回スナップショットでは鳴らさず同期だけ）
let blinkOn = false;
let lastSt = null;
let audioEverOn = false; // 一度でも音声が有効になったか（バナーのラッチ用）

function postCmd(obj) {
  fetch('/api/cmd', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(obj) }).catch(() => {});
}

function fmt(sec) {
  const over = sec < 0;
  const a = Math.abs(sec);
  const m = Math.floor(a / 60);
  const s = a % 60;
  const body = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  return { over, body };
}

// ユーザー操作で音声を解錠（AudioContext は bell.js が一元管理）
function unlockAudio() { if (window.Bell) { Bell.unlock(); audioEverOn = true; } }

function render(st) {
  lastSt = st;
  if (window.Bell && typeof st.volume === 'number') Bell.setVolume(st.volume);
  if (window.Bell && typeof st.pitch === 'number') Bell.setPitch(st.pitch);
  // A: 大きい時計のスコープ（現フェーズ / 全体=質疑込み）
  const totalRem = st.segment === 'qa' ? st.remainingSec : st.remainingSec + st.qaSec;
  const scopeTotal = st.clockScope === 'total';
  const bigSec = scopeTotal ? totalRem : st.remainingSec;

  const { over, body } = fmt(bigSec);
  const clock = document.getElementById('clock');
  clock.innerHTML = (over ? '<span class="sign">+</span>' : '') + body;

  // 色分け：緑→黄→赤。講演は予鈴以下で黄、質疑は残り60秒以下で黄（質疑はベルなし・色だけ）。
  const warnSec = st.segment === 'talk' ? Math.max(st.talkWarnSec || 0, st.talkWarn2Sec || 0) : 60;
  document.body.classList.remove('warn', 'over');
  if (scopeTotal && st.segment === 'talk') {
    if (totalRem <= 0) document.body.classList.add('over'); // 全体スコープ(講演中)は全体超過のみ赤
  } else {
    if (st.remainingSec <= 0) document.body.classList.add('over');
    else if (warnSec > 0 && st.remainingSec <= warnSec) document.body.classList.add('warn');
  }

  const en = st.lang === 'en';
  const hasQa = st.qaSec > 0;
  // バッジはフェーズ名のみ（範囲は下の「全体のこり…（質疑応答こみ）」で伝わる）
  const segLabel = st.segment === 'qa' ? (en ? 'Q&A' : '質疑応答') : (en ? 'Talk' : '講演');
  document.querySelector('#segment .badge').textContent = segLabel;

  // 副表示：もう一方のスコープを表示（講演フェーズだけ意味を持つ）
  const totalEl = document.getElementById('total');
  if (hasQa && st.segment === 'talk') {
    if (scopeTotal) {
      const p = fmt(st.remainingSec);
      totalEl.textContent = (en ? 'Talk left ' : '講演のこり ') + (p.over ? '+' : '') + p.body;
    } else {
      const tot = fmt(totalRem);
      totalEl.textContent = (en ? 'Total ' : '全体のこり ') + (tot.over ? '+' : '') + tot.body
        + (en ? ' (incl. Q&A)' : '（質疑応答こみ）');
    }
    totalEl.style.visibility = 'visible';
  } else {
    totalEl.style.visibility = 'hidden';
  }
  const statusEl = document.getElementById('status');
  statusEl.textContent =
    st.phase === 'running' ? (over ? (en ? 'OVERTIME' : '超過') : '') :
    st.phase === 'paused'  ? (en ? 'Paused' : '一時停止中') :
    (en ? 'Standby' : '待機中');
  document.documentElement.lang = en ? 'en' : 'ja';
  document.getElementById('ovTitle').textContent = en ? 'Tap to start' : 'タップして開始';
  document.getElementById('ovHint').textContent = en
    ? 'Tap once to enable the bell sound' : '音を鳴らすために最初に一度タップしてください';

  // 終了予定（壁時計）：実行中だけ表示＝今＋全体残り（質疑込み）
  const endEl = document.getElementById('endtime');
  if (st.phase === 'running') {
    const end = new Date(Date.now() + totalRem * 1000);
    const hm = String(end.getHours()).padStart(2, '0') + ':' + String(end.getMinutes()).padStart(2, '0');
    endEl.textContent = (en ? 'Ends ~ ' : '終了予定 ') + hm;
    endEl.style.visibility = 'visible';
  } else {
    endEl.style.visibility = 'hidden';
  }

  const msg = document.getElementById('message');
  if (st.message) {
    if (msg.textContent !== st.message) {       // 新しいメッセージのたびに点滅を再生
      msg.textContent = st.message;
      msg.style.animation = 'none'; void msg.offsetWidth; msg.style.animation = '';
    }
    msg.classList.add('show');
  } else {
    msg.classList.remove('show');
  }

  // ベル（id が進んだら1回だけ）— 1鈴=予鈴 / 2鈴=講演終了 / 3鈴=全体終了
  // 初回（ページを開いた/再接続した直後）は基準合わせのみで鳴らさない＝過去のベルの再生を防ぐ
  if (st.bellEvent) {
    if (lastBellId === null) {
      lastBellId = st.bellEvent.id;
    } else if (st.bellEvent.id > lastBellId) {
      lastBellId = st.bellEvent.id;
      // iOS は放置で AudioContext が suspended になるので鳴らす直前に resume
      if (window.Bell && st.ipadBell !== false) Bell.ring(st.bellEvent.type, st.bellSound); // iPad音 ON 時のみ
    }
  }
}

// 超過時の点滅
setInterval(() => {
  if (document.body.classList.contains('over')) {
    blinkOn = !blinkOn;
    document.body.classList.toggle('blink', blinkOn);
  } else {
    document.body.classList.remove('blink');
  }
}, 600);

function connect() {
  const es = new EventSource('/events');
  es.onmessage = (e) => { try { render(JSON.parse(e.data)); } catch (_) {} };
  es.onerror = () => { es.close(); setTimeout(connect, 1500); }; // 自動再接続
}
connect();

// 大きい数字をタップ → スコープ（現フェーズ ⇄ 全体）を切替
document.getElementById('clock').addEventListener('click', () => {
  if (!lastSt || !(lastSt.qaSec > 0)) return;
  postCmd({ action: 'setClockScope', scope: lastSt.clockScope === 'total' ? 'phase' : 'total' });
});

// 画面スリープ防止（Wake Lock）。OS が解放したり非表示→再表示で外れるので都度取り直す。
// 画面スリープ防止（Screen Wake Lock／iPadOS 16.4+ で有効）。解放されたら取り直す。
let wakeLock = null;
async function acquireWakeLock() {
  try {
    if ('wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (_) { /* 取得不可な環境は無視（端末設定の自動ロックなしで補う） */ }
}
acquireWakeLock(); // 起動時にも試みる
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { acquireWakeLock(); if (window.Bell) Bell.unlock(); }
});
// 画面のどこを触っても：音声を有効化＋スリープ防止を取り直す
document.addEventListener('pointerdown', () => { unlockAudio(); acquireWakeLock(); });

// 音声が一度でも有効になるまで赤バナーで促す（有効化後はラッチして二度と出さない＝誤警告防止）
const audiowarn = document.getElementById('audiowarn');
audiowarn.addEventListener('click', () => {
  unlockAudio();
  if (window.Bell) Bell.ring('warn', (lastSt && lastSt.bellSound) || Bell.DEFAULT); // 確認音
});
const audiowarnTimer = setInterval(() => {
  if (window.Bell && Bell.running()) audioEverOn = true;
  if (audioEverOn) { audiowarn.style.display = 'none'; clearInterval(audiowarnTimer); }
}, 500);

// 起動オーバーレイのタップ＝解錠＋全画面（確認音は控えめに warn 1音）
document.getElementById('overlay').addEventListener('click', () => {
  unlockAudio(); // 解錠のみ（確認音は鳴らさない＝接続時に鳴ってうるさいため）
  document.getElementById('overlay').classList.add('hidden');
  acquireWakeLock();
  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(() => {});
  }
});
</script>
</body>
</html>
